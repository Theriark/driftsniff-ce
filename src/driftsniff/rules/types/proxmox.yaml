# Type tables of the Proxmox VE collector. Notes with sources and dates:
# docs/vendor-notes/proxmox.md.
#
# Field names were read from the official API schema (pve-docs api-viewer, apidoc.js) and the
# pve-access-control and pve-storage sources on 2026-11-12. No lab Proxmox VE was used, so no name
# is lab verified. UNVERIFIED below:
#   * proxmox-storage, proxmox-ha-resources, proxmox-ha-groups: the schema of the LIST answer
#     names only the key; the members come from the create parameters (storage, HA) and, for
#     storage, from the source of the list handler (it returns the stored config). Not lab checked.
#   * proxmox-cluster-options: whether the property strings (migration, ha, crs, next-id, u2f,
#     webauthn, bwlimit, tag-style, user-tag-access, notify, replication) come back as text or as
#     objects. The top names are listed; members of an object stay unclassified (medium).
#   * proxmox-backup-jobs: the members of prune-backups, fleecing and performance (objects).
#   * proxmox-pools: that the list answer carries members (the schema says so for 8.x).
#   * cipassword: whether the config answer masks it. It is secret either way.
#
# Numbered config keys (net0, scsi1, mp0, acmedomain0) are folded by the collector into one list
# per kind, named like the schema (net[n]), of {slot, value} members keyed by slot.
#
# Proxmox answers booleans as 0 and 1; the rules use those numbers.
#
# Secrets: cipassword (VM), env (container, may hold credentials), password, encryption-key and
# keyring (storage: kept in /etc/pve/priv and normally not returned), password and client-key
# (realms; the realm read returns the stored hash unfiltered), keys (yubico ids of a user),
# http_proxy (may carry user:password). API tokens are metadata only: Proxmox never returns a
# token secret after creation.
version: 1
types:
  - resource: proxmox-cluster-options
    key_field: id
    fields:
      id: config
      keyboard: config
      language: config
      console: config
      http_proxy: secret
