# Type tables of the UniFi collector (P7-T1). Notes with sources: docs/vendor-notes/unifi.md.
#
# The field paths below were checked on 2026-11-13 against the integration API of a real UniFi
# Network 10.6.109 controller: every path that controller returned is classified here, and a
# test (tests/contract/test_unifi_real_shapes.py) walks real-shaped objects through these tables
# and fails on any unclassified path. Resources that controller had no objects of (ACL rules,
# device tags) and the site settings placeholder are still UNVERIFIED. A field that is not listed
# is unclassified and shows as a fingerprint only.
#
# The resource names carry the prefix unifi- because a resource can be defined only once across
# all type files and the Xen Orchestra tables already use networks and users.
#
# Two decisions that the table makes visible to the collector (P7-T4):
# - The action of a firewall policy is nested in the vendor object (action.type). The order
#   detail of the engine reads a flat top level field, so the table names a derived top level
#   field actionType as its action_field. The collector copies action.type to actionType before
#   it normalises; action.type itself is ignore class so a change is reported once.
# - Firewall policies are ordered per pair of zones by the vendor. The position list of the
#   collection (one list for the resource) is built by the collector from those per pair lists;
#   policies the controller made itself are placed between the two lists of their pair.
#
# Floors: zones, ACL rules, RADIUS profiles and VPN servers and tunnels are high for every kind of
# change (removing a zone or an ACL rule is critical). Firewall policies and WiFi broadcasts have
# no floor for a modified object, so that their rule packs can rate a rename low or medium; every
# field of theirs that changes what traffic or which clients are allowed has its own high rule.
#
# Secrets: 10.6.109 returns no WiFi passphrase, no RADIUS shared secret and no VPN key. The secret
# entries below are kept on purpose, so that if another version does return one it is never shown.
#
# Lists of ids, addresses, ports, frequencies and filter members are sets: the API gives them no
# meaning by position. Only the collection of firewall policies (and of ACL rules) is ordered.
version: 1
types:
  - resource: unifi-sites
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      internalReference: config
  - resource: unifi-site-settings
    key_field: id
    fields:
      # No site settings endpoint is known (notes, section "Site settings"); only the key is
      # classified so that a later task can add the fields it verifies.
      id: config
  - resource: unifi-networks
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      enabled: config
      default: config
      management: config
      vlanId: config
      zoneId: config
      metadata.origin: config
      metadata.configurable: config
  - resource: unifi-wifi-broadcasts
    key_field: id
    name_field: name
    floors: {added: high, removed: high}
    fields:
      id: config
      name: config
      enabled: config
      type: config
      network.type: config
      network.networkId: config
      securityConfiguration.type: config
      securityConfiguration.passphrase: secret
      broadcastingFrequenciesGHz: config
      metadata.origin: config
    lists:
      broadcastingFrequenciesGHz: set
  - resource: unifi-firewall-zones
    key_field: id
    name_field: name
    floors: {added: high, removed: critical, modified: high, moved: high}
    fields:
      id: config
      name: config
      networkIds: config
      metadata.origin: config
      metadata.configurable: config
    lists:
      networkIds: set
  - resource: unifi-firewall-policies
    collection: ordered-keyed
    key_field: id
    name_field: name
    action_field: actionType
    blocking_actions: [block, reject]
    first_match: true
    floors: {added: high, removed: critical, moved: high}
    fields:
      id: config
      name: config
      description: config
      enabled: config
      actionType: config
      action.type: ignore
      # The position number the controller returns (verified on 10.6.109); the order is tracked
      # by the ordering lists instead, so a renumbering is not a change.
      index: ignore
      action.allowReturnTraffic: config
      connectionStateFilter: config
      ipsecFilter: config
      loggingEnabled: config
      metadata.origin: config
      ipProtocolScope.ipVersion: config
      ipProtocolScope.protocolFilter.type: config
      ipProtocolScope.protocolFilter.matchOpposite: config
      ipProtocolScope.protocolFilter.preset.name: config
      ipProtocolScope.protocolFilter.protocol.name: config
      source.zoneId: config
      source.trafficFilter.type: config
      source.trafficFilter.ipAddressFilter.type: config
      source.trafficFilter.ipAddressFilter.matchOpposite: config
      source.trafficFilter.ipAddressFilter.trafficMatchingListId: config
      source.trafficFilter.ipAddressFilter.items: config
      source.trafficFilter.ipAddressFilter.items.type: config
      source.trafficFilter.ipAddressFilter.items.value: config
      source.trafficFilter.networkFilter.matchOpposite: config
      source.trafficFilter.networkFilter.networkIds: config
      source.trafficFilter.portFilter.type: config
      source.trafficFilter.portFilter.matchOpposite: config
      source.trafficFilter.portFilter.trafficMatchingListId: config
      source.trafficFilter.portFilter.items: config
      source.trafficFilter.portFilter.items.type: config
      source.trafficFilter.portFilter.items.value: config
      source.trafficFilter.portFilter.items.start: config
      source.trafficFilter.portFilter.items.stop: config
      source.trafficFilter.siteToSiteVpnTunnelFilter.siteToSiteVpnTunnelId: config
      source.trafficFilter.macAddressFilter.macAddresses: config
      source.trafficFilter.vpnServerFilter.matchOpposite: config
      source.trafficFilter.vpnServerFilter.vpnServerIds: config
      destination.zoneId: config
      destination.trafficFilter.type: config
      destination.trafficFilter.ipAddressFilter.type: config
      destination.trafficFilter.ipAddressFilter.matchOpposite: config
      destination.trafficFilter.ipAddressFilter.trafficMatchingListId: config
      destination.trafficFilter.ipAddressFilter.items: config
      destination.trafficFilter.ipAddressFilter.items.type: config
      destination.trafficFilter.ipAddressFilter.items.value: config
      destination.trafficFilter.networkFilter.matchOpposite: config
      destination.trafficFilter.networkFilter.networkIds: config
      destination.trafficFilter.portFilter.type: config
      destination.trafficFilter.portFilter.matchOpposite: config
      destination.trafficFilter.portFilter.trafficMatchingListId: config
      destination.trafficFilter.portFilter.items: config
      destination.trafficFilter.portFilter.items.type: config
      destination.trafficFilter.portFilter.items.value: config
      destination.trafficFilter.portFilter.items.start: config
      destination.trafficFilter.portFilter.items.stop: config
      destination.trafficFilter.siteToSiteVpnTunnelFilter.siteToSiteVpnTunnelId: config
    lists:
      connectionStateFilter: set
      source.trafficFilter.ipAddressFilter.items: set
      source.trafficFilter.networkFilter.networkIds: set
      source.trafficFilter.portFilter.items: set
      source.trafficFilter.macAddressFilter.macAddresses: set
      source.trafficFilter.vpnServerFilter.vpnServerIds: set
      destination.trafficFilter.ipAddressFilter.items: set
      destination.trafficFilter.networkFilter.networkIds: set
      destination.trafficFilter.portFilter.items: set
  - resource: unifi-acl-rules
    collection: ordered-keyed
    key_field: id
    name_field: name
    action_field: action
    blocking_actions: [block]
    first_match: true
    floors: {added: high, removed: critical, modified: high, moved: high}
    fields:
      # UNVERIFIED: the 10.6.109 controller had no ACL rules, so these names are not checked.
      id: config
      name: config
      description: config
      type: config
      enabled: config
      action: config
      index: ignore
  - resource: unifi-dns-policies
    key_field: id
    name_field: domain
    fields:
      id: config
      type: config
      enabled: config
      domain: config
      ipv4Address: config
      ttlSeconds: config
      metadata.origin: config
  - resource: unifi-traffic-matching-lists
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      type: config
      items: config
      items.type: config
      items.value: config
    lists:
      items: set
  - resource: unifi-wans
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
  - resource: unifi-vpn-site-to-site-tunnels
    key_field: id
    name_field: name
    floor: high
    fields:
      id: config
      name: config
      type: config
      metadata.origin: config
      metadata.source: config
      preSharedKey: secret
  - resource: unifi-vpn-servers
    key_field: id
    name_field: name
    floor: high
    fields:
      id: config
      name: config
      type: config
      enabled: config
      metadata.origin: config
      preSharedKey: secret
  - resource: unifi-radius-profiles
    key_field: id
    name_field: name
    floor: high
    fields:
      id: config
      name: config
      metadata.origin: config
      metadata.configurable: config
      sharedSecret: secret
  - resource: unifi-device-tags
    key_field: id
    name_field: name
    fields:
      # UNVERIFIED: the 10.6.109 controller had no device tags, so these names are not checked.
      id: config
      name: config
      deviceIds: config
    lists:
      deviceIds: set
  - resource: unifi-devices
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      model: config
      macAddress: config
      ipAddress: config
      firmwareVersion: config
      supported: config
      features: config
      interfaces: config
      # Volatile: the connection state and whether newer firmware exists change without anybody
      # changing the configuration.
      state: ignore
      firmwareUpdatable: ignore
    lists:
      features: set
      interfaces: set
