      tags: config
      tags.tag: config
      tags.operator: config
      tags.value: config
    lists:
      hostgroups: {mode: set, key_field: groupid}
      hosts: {mode: set, key_field: hostid}
      timeperiods: set
      tags: set
  # One object, keyed "authentication" by the collector. Super admin only.
  - resource: zabbix-authentication
    key_field: id
    floor: high
    fields:
      id: config
