      mfaid: config
      ldap_configured: config
      ldap_host: config
      ldap_port: config
      ldap_base_dn: config
      ldap_search_attribute: config
      ldap_bind_dn: config
      ldap_bind_password: secret
      saml_idp_entityid: config
      saml_sso_url: config
      saml_slo_url: config
      saml_username_attribute: config
      saml_sp_entityid: config
      saml_nameid_format: config
      saml_sign_messages: config
      saml_sign_assertions: config
      saml_sign_authn_requests: config
      saml_sign_logout_requests: config
      saml_sign_logout_responses: config
      saml_encrypt_nameid: config
      saml_encrypt_assertions: config
