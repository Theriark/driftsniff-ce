# Type tables of the Zabbix collector. Notes with sources and dates: docs/vendor-notes/zabbix.md.
#
# The field names were read from the Zabbix manual (versions 8.0 "current", 7.0, 6.2 and 6.0) on
# 2026-11-12. No lab Zabbix was used, so no name is lab verified. Zabbix sends every value as text
# ("0", "1", "3"), and the rules compare texts.
#
# UNVERIFIED (not found in the pages read, listed so a value that arrives is classified):
# - the members of the action operation sub-objects (opmessage, opmessage_grp, opmessage_usr,
#   opcommand, opcommand_hst, opcommand_grp, opgroup, optemplate, opinventory, optag,
#   opconditions) and notify_if_canceled / pause_symptoms of an action;
# - the 6.0 names of a proxy (host, status, proxy_address, auto_compress) and of the 6.0 LDAP and
#   SAML fields of the authentication settings, taken from the 6.0 pages but not compared with a
#   6.0 server;
# - the members of the SNMP interface details and of a maintenance time period;
# - whether a media type password, an OAuth secret or an IPMI password is returned at all.
# Anything that is not listed is unclassified and shows as a fingerprint only.
#
# Secrets: the value of a secret macro (type "1") is write-only in Zabbix; the collector still
# moves any such value to secret_value (collectors/zabbix/normalize.py). Classed secret as well: the
# IPMI password and PSK of a host, SNMP community and passphrases of an interface, the media type
# password, OAuth secrets and tokens, the values of media type parameters (webhook parameters hold
# URLs and tokens alike), the webhook script (it can hold a token written inline), the PSK of a
# proxy and the LDAP bind password of the 6.0 authentication settings.
#
# Volatile, so ignored: trigger value, lastchange, state and error; host maintenance status and
# availability; proxy last access, version, compatibility and state; OAuth token times; user
# sign-in attempts. Users, user groups, user roles and the authentication settings have the object
# floor high.
version: 1
types:
  - resource: zabbix-hosts
    key_field: hostid
    name_field: host
    fields:
      hostid: config
      host: config
      name: config
      status: config
      description: config
      inventory_mode: config
      ipmi_authtype: config
      ipmi_privilege: config
      ipmi_username: config
      ipmi_password: secret
      tls_connect: config
      tls_accept: config
      tls_issuer: config
      tls_subject: config
      tls_psk: secret
      tls_psk_identity: secret
      proxy_hostid: config
      monitored_by: config
      proxyid: config
      proxy_groupid: config
      assigned_proxyid: ignore
      flags: ignore
      maintenance_status: ignore
      maintenance_type: ignore
      maintenance_from: ignore
      maintenanceid: ignore
      active_available: ignore
      interfaces: config
      interfaces.interfaceid: config
      interfaces.type: config
      interfaces.main: config
      interfaces.useip: config
      interfaces.ip: config
      interfaces.dns: config
      interfaces.port: config
      interfaces.details: config
      interfaces.details.version: config
      interfaces.details.bulk: config
      interfaces.details.community: secret
      interfaces.details.securityname: config
      interfaces.details.securitylevel: config
      interfaces.details.authpassphrase: secret
      interfaces.details.privpassphrase: secret
      interfaces.details.authprotocol: config
      interfaces.details.privprotocol: config
      interfaces.details.contextname: config
      interfaces.details.max_repetitions: config
      interfaces.available: ignore
      interfaces.error: ignore
      interfaces.errors_from: ignore
      interfaces.disable_until: ignore
      hostgroups: config
      hostgroups.groupid: config
      hostgroups.name: config
      parentTemplates: config
      parentTemplates.templateid: config
      parentTemplates.name: config
      parentTemplates.link_type: config
      macros: config
      macros.macro: config
      macros.value: config
      macros.secret_value: secret
      macros.type: config
      macros.description: config
      macros.automatic: config
      macros.hostmacroid: ignore
      macros.hostid: ignore
      tags: config
      tags.tag: config
      tags.value: config
      tags.automatic: config
    lists:
      interfaces: {mode: set, key_field: interfaceid}
      hostgroups: {mode: set, key_field: groupid}
      parentTemplates: {mode: set, key_field: templateid}
      macros: {mode: set, key_field: macro}
      tags: set
  - resource: zabbix-host-groups
    key_field: groupid
    name_field: name
    fields:
      groupid: config
      name: config
      flags: ignore
      uuid: ignore
      internal: ignore
  - resource: zabbix-templates
    key_field: templateid
    name_field: host
    fields:
      templateid: config
      host: config
      name: config
      description: config
      uuid: ignore
      vendor_name: ignore
      vendor_version: ignore
      parentTemplates: config
      parentTemplates.templateid: config
      parentTemplates.name: config
      macros: config
      macros.macro: config
      macros.value: config
      macros.secret_value: secret
      macros.type: config
      macros.description: config
      macros.automatic: config
      macros.hostmacroid: ignore
      macros.hostid: ignore
    lists:
      parentTemplates: {mode: set, key_field: templateid}
      macros: {mode: set, key_field: macro}
  # Plain triggers of templates and hosts (the collector filters flags "0"); a trigger a template
  # gives a host is its own object with templateid set.
  - resource: zabbix-triggers
    key_field: triggerid
    name_field: description
    fields:
      triggerid: config
      description: config
      expression: config
      recovery_mode: config
      recovery_expression: config
      priority: config
      status: config
      type: config
      manual_close: config
      correlation_mode: config
      correlation_tag: config
      event_name: config
      opdata: config
      url: config
      url_name: config
      comments: config
      templateid: config
      hosts: config
      hosts.hostid: config
      hosts.host: config
      value: ignore
      lastchange: ignore
      state: ignore
      error: ignore
      flags: ignore
      uuid: ignore
    lists:
      hosts: {mode: set, key_field: hostid}
  - resource: zabbix-actions
    key_field: actionid
    name_field: name
    fields:
      actionid: config
      name: config
      eventsource: config
      status: config
      esc_period: config
      pause_suppressed: config
      notify_if_canceled: config
      pause_symptoms: config
      filter.evaltype: config
      filter.formula: config
      filter.eval_formula: config
      filter.conditions: config
      filter.conditions.conditiontype: config
      filter.conditions.operator: config
      filter.conditions.value: config
      filter.conditions.value2: config
      filter.conditions.formulaid: config
      operations: config
      operations.operationid: config
      operations.operationtype: config
      operations.esc_period: config
      operations.esc_step_from: config
      operations.esc_step_to: config
      operations.evaltype: config
      operations.opconditions: config
      operations.opconditions.conditiontype: config
      operations.opconditions.operator: config
      operations.opconditions.value: config
      operations.opmessage.default_msg: config
      operations.opmessage.subject: config
      operations.opmessage.message: config
      operations.opmessage.mediatypeid: config
      operations.opmessage_grp: config
      operations.opmessage_grp.usrgrpid: config
      operations.opmessage_usr: config
      operations.opmessage_usr.userid: config
      operations.opcommand.scriptid: config
      operations.opcommand_hst: config
      operations.opcommand_hst.hostid: config
      operations.opcommand_grp: config
      operations.opcommand_grp.groupid: config
      operations.opgroup: config
      operations.opgroup.groupid: config
      operations.optemplate: config
      operations.optemplate.templateid: config
      operations.opinventory.inventory_mode: config
      operations.optag: config
      operations.optag.tag: config
      operations.optag.value: config
      operations.actionid: ignore
      recovery_operations: config
      recovery_operations.operationid: config
      recovery_operations.operationtype: config
      recovery_operations.opmessage.default_msg: config
      recovery_operations.opmessage.subject: config
      recovery_operations.opmessage.message: config
      recovery_operations.opmessage.mediatypeid: config
      recovery_operations.opmessage_grp: config
      recovery_operations.opmessage_grp.usrgrpid: config
      recovery_operations.opmessage_usr: config
      recovery_operations.opmessage_usr.userid: config
      recovery_operations.opcommand.scriptid: config
      recovery_operations.actionid: ignore
      update_operations: config
      update_operations.operationid: config
      update_operations.operationtype: config
      update_operations.opmessage.default_msg: config
      update_operations.opmessage.subject: config
      update_operations.opmessage.message: config
      update_operations.opmessage.mediatypeid: config
      update_operations.opmessage_grp: config
      update_operations.opmessage_grp.usrgrpid: config
      update_operations.opmessage_usr: config
      update_operations.opmessage_usr.userid: config
      update_operations.opcommand.scriptid: config
      update_operations.actionid: ignore
    lists:
      filter.conditions: set
      operations: {mode: set, key_field: operationid}
      operations.opconditions: set
      operations.opmessage_grp: {mode: set, key_field: usrgrpid}
      operations.opmessage_usr: {mode: set, key_field: userid}
      operations.opcommand_hst: {mode: set, key_field: hostid}
      operations.opcommand_grp: {mode: set, key_field: groupid}
      operations.opgroup: {mode: set, key_field: groupid}
      operations.optemplate: {mode: set, key_field: templateid}
      operations.optag: set
      recovery_operations: {mode: set, key_field: operationid}
      recovery_operations.opmessage_grp: {mode: set, key_field: usrgrpid}
      recovery_operations.opmessage_usr: {mode: set, key_field: userid}
      update_operations: {mode: set, key_field: operationid}
      update_operations.opmessage_grp: {mode: set, key_field: usrgrpid}
      update_operations.opmessage_usr: {mode: set, key_field: userid}
  - resource: zabbix-media-types
    key_field: mediatypeid
    name_field: name
    fields:
      mediatypeid: config
      name: config
      type: config
      status: config
      description: config
      provider: config
      smtp_server: config
      smtp_port: config
      smtp_helo: config
      smtp_email: config
      smtp_security: config
      smtp_verify_peer: config
      smtp_verify_host: config
      smtp_authentication: config
      username: config
      passwd: secret
      message_format: config
      exec_path: config
      gsm_modem: config
      script: secret
      timeout: config
      process_tags: config
      show_event_menu: config
      event_menu_url: config
      event_menu_name: config
      maxsessions: config
      maxattempts: config
      attempt_interval: config
      parameters: config
      parameters.name: config
      parameters.sortorder: config
      parameters.value: secret
      redirection_url: config
      client_id: config
      client_secret: secret
      authorization_url: config
      token_url: config
      access_token: secret
      refresh_token: secret
      tokens_status: ignore
      access_token_updated: ignore
      access_expires_in: ignore
    lists:
      parameters: {mode: set, key_field: name}
  - resource: zabbix-users
    key_field: userid
    name_field: username
    floor: high
    fields:
      userid: config
      username: config
      name: config
      surname: config
      roleid: config
      autologin: config
      autologout: config
      url: config
      role.type: config
      role.roleid: ignore
      usrgrps: config
      usrgrps.usrgrpid: config
      usrgrps.name: config
      passwd: secret
      attempt_clock: ignore
      attempt_failed: ignore
      attempt_ip: ignore
      ts_provisioned: ignore
    lists:
      usrgrps: {mode: set, key_field: usrgrpid}
  # gui_access 0 system default, 1 internal, 2 LDAP, 3 frontend access disabled; users_status 0
  # enabled, 1 disabled; permission 0 denied, 2 read, 3 read-write.
  - resource: zabbix-user-groups
    key_field: usrgrpid
    name_field: name
    floor: high
    fields:
      usrgrpid: config
      name: config
      gui_access: config
      users_status: config
      debug_mode: config
      userdirectoryid: config
      mfa_status: config
      mfaid: config
      hostgroup_rights: config
      hostgroup_rights.id: config
      hostgroup_rights.permission: config
      templategroup_rights: config
      templategroup_rights.id: config
      templategroup_rights.permission: config
      tag_filters: config
      tag_filters.groupid: config
      tag_filters.tag: config
      tag_filters.value: config
    lists:
      hostgroup_rights: {mode: set, key_field: id}
      templategroup_rights: {mode: set, key_field: id}
      tag_filters: set
  # type 1 User, 2 Admin, 3 Super admin. The keys of the rules object hold dots themselves
  # ("ui.default_access"); a path here is the joined text, as the diff writes it.
  - resource: zabbix-user-roles
    key_field: roleid
    name_field: name
    floor: high
    fields:
      roleid: config
      name: config
      type: config
      readonly: config
      rules.ui: config
      rules.ui.name: config
      rules.ui.status: config
      rules.ui.default_access: config
      rules.services.read.mode: config
      rules.services.read.list: config
      rules.services.read.list.serviceid: config
      rules.services.read.tag.tag: config
      rules.services.read.tag.value: config
      rules.services.write.mode: config
      rules.services.write.list: config
      rules.services.write.list.serviceid: config
      rules.services.write.tag.tag: config
      rules.services.write.tag.value: config
      rules.modules: config
      rules.modules.moduleid: config
      rules.modules.status: config
      rules.modules.default_access: config
      rules.api.access: config
      rules.api.mode: config
      rules.api: config
      rules.actions: config
      rules.actions.name: config
      rules.actions.status: config
      rules.actions.default_access: config
    lists:
      rules.ui: {mode: set, key_field: name}
      rules.services.read.list: {mode: set, key_field: serviceid}
      rules.services.write.list: {mode: set, key_field: serviceid}
      rules.modules: {mode: set, key_field: moduleid}
      rules.api: set
      rules.actions: {mode: set, key_field: name}
  - resource: zabbix-global-macros
    key_field: globalmacroid
    name_field: macro
    fields:
      globalmacroid: config
      macro: config
      value: config
      secret_value: secret
      type: config
      description: config
  # 7.0 and later names first, then the 6.0 names (UNVERIFIED against a server).
  - resource: zabbix-proxies
    key_field: proxyid
    name_field: name
    fields:
      proxyid: config
      name: config
      proxy_groupid: config
      local_address: config
      local_port: config
      operating_mode: config
      description: config
      address: config
      port: config
      allowed_addresses: config
      tls_connect: config
      tls_accept: config
      tls_issuer: config
      tls_subject: config
      tls_psk_identity: secret
      tls_psk: secret
      custom_timeouts: config
      timeout_zabbix_agent: config
      timeout_simple_check: config
      timeout_snmp_agent: config
      timeout_external_check: config
      timeout_db_monitor: config
      timeout_http_agent: config
      timeout_ssh_agent: config
      timeout_telnet_agent: config
      timeout_script: config
      timeout_browser: config
      timeout_telemetry_query: config
      data_collection_status: config
      max_messages_per_second: config
      additional_resource_attributes: config
      additional_resource_attributes.key: config
      additional_resource_attributes.value: config
      additional_resource_attributes.signal_type: config
      host: config
      status: config
      proxy_address: config
      auto_compress: config
      lastaccess: ignore
      version: ignore
      compatibility: ignore
      state: ignore
      assigned_proxyid: ignore
    lists:
      additional_resource_attributes: set
  - resource: zabbix-maintenance
    key_field: maintenanceid
    name_field: name
    fields:
      maintenanceid: config
      name: config
      maintenance_type: config
      description: config
      active_since: config
      active_till: config
      tags_evaltype: config
      hostgroups: config
      hostgroups.groupid: config
      hostgroups.name: config
      hosts: config
      hosts.hostid: config
      hosts.host: config
      timeperiods: config
      timeperiods.timeperiod_type: config
      timeperiods.every: config
      timeperiods.month: config
      timeperiods.dayofweek: config
      timeperiods.day: config
