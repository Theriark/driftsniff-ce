# Type tables of the TrueNAS collector. Notes with sources and dates: docs/vendor-notes/truenas.md.
#
# Field names are taken from the published API reference of TrueNAS 25.10 (api.truenas.com,
# read 2026-11-12, the *.query result schemas). They are checked against the documentation ONLY:
# no lab TrueNAS was read, so every name is UNVERIFIED against a live system. A field that is not
# listed here is unclassified and shows as a fingerprint only, never as a value.
#
# Names that are not in the reference at all and come from this collector:
#   truenas-nfs-shares.open_to_all   derived: true when the share names no network and no host
#   truenas-users.full_admin         derived: true when roles holds FULL_ADMIN (the role name
#                                    FULL_ADMIN itself is UNVERIFIED against a live system)
# The ZFS properties of pools and datasets arrive as {value, rawvalue, parsed, source, ...}; the
# collector keeps only value, so the property is named directly (compression, not
# compression.value). Snapshot tasks inside a replication task are reduced to their ids.
#
# Volatile and run state fields are ignore class so that reading an unchanged system twice gives no
# change: pool health, scan and usage numbers, the vdev topology (it carries per disk state and
# counters), dataset space numbers, share lock state, service state and pids, interface link state,
# the live network state, task state and job, password age and certificate expiry flags.
#
# Private keys never reach the pipeline (the collector drops them, the table ignores them too).
# Password hashes, cloud provider secrets and encryption passwords are secret class: a change is
# shown as a keyed fingerprint only.
#
# Users, groups, the SSH service, SMB, NFS and iSCSI shares and cloud credentials have the object
# floor high. Pools, datasets and the data protection tasks have floor high for a removal.
version: 1
