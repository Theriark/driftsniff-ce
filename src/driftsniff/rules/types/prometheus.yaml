  # One object per target, keyed by its name, else by its URL: a new URL of an unnamed target
  # shows as one target removed and one added, both high by the floors. Sending samples to a new
  # place can leak every metric.
  - resource: prometheus-remote-write
    key_field: id
    name_field: id
    floors: {added: high, removed: high}
    fields:
      id: config
      url: config
      name: config
      protobuf_message: config
      remote_timeout: config
      headers: secret
      send_exemplars: config
      send_native_histograms: config
      round_robin_dns: config
      convert_nhcb_to_classic: config
      azuread.cloud: config
      azuread.oauth.client_id: config
      azuread.oauth.client_secret: secret
      azuread.oauth.tenant_id: config
      azuread.certificate.certificate_password: secret
      google_iam.credentials_file: config
      queue_config.capacity: config
      queue_config.max_shards: config
      queue_config.min_shards: config
      queue_config.max_samples_per_send: config
      queue_config.batch_send_deadline: config
      queue_config.min_backoff: config
      queue_config.max_backoff: config
      queue_config.retry_on_http_429: config
      queue_config.sample_age_limit: config
      metadata_config.send: config
      metadata_config.send_interval: config
      metadata_config.max_samples_per_send: config
      basic_auth.username: config
      basic_auth.username_file: config
      basic_auth.password: secret
      basic_auth.password_file: config
      authorization.type: config
      authorization.credentials: secret
      authorization.credentials_file: config
      bearer_token: secret
      bearer_token_file: config
      oauth2.client_id: config
      oauth2.client_secret: secret
      oauth2.client_secret_file: config
      oauth2.scopes: config
      oauth2.token_url: config
      oauth2.endpoint_params: secret
      oauth2.client_certificate_key: secret
      follow_redirects: config
      enable_http2: config
      tls_config.ca: config
      tls_config.ca_file: config
      tls_config.cert: config
      tls_config.cert_file: config
      tls_config.key: secret
      tls_config.key_file: config
      tls_config.server_name: config
      tls_config.insecure_skip_verify: config
      tls_config.min_version: config
      tls_config.max_version: config
      proxy_url: config
      no_proxy: config
      proxy_from_environment: config
      proxy_connect_header: secret
      http_headers: secret
      sigv4.region: config
      sigv4.access_key: config
      sigv4.secret_key: secret
      sigv4.profile: config
      sigv4.role_arn: config
      write_relabel_configs: config
      write_relabel_configs.source_labels: config
      write_relabel_configs.separator: config
      write_relabel_configs.target_label: config
      write_relabel_configs.regex: config
      write_relabel_configs.modulus: config
      write_relabel_configs.replacement: config
      write_relabel_configs.action: config
    lists:
      write_relabel_configs: ordered-scalar
      write_relabel_configs.source_labels: ordered-scalar
  # One object keyed "flags". Every value is text ("true", "15d"). The collector turns the dots
  # and dashes of a flag name into underscores: web.enable-admin-api is web_enable_admin_api.
  - resource: prometheus-flags
    key_field: id
    fields:
      id: config
      web_enable_admin_api: config
      web_enable_lifecycle: config
      web_enable_remote_write_receiver: config
      web_enable_otlp_receiver: config
      web_config_file: config
      web_external_url: config
      web_listen_address: config
      web_route_prefix: config
      web_cors_origin: config
      config_file: config
      storage_tsdb_retention_time: config
      storage_tsdb_retention_size: config
      storage_tsdb_path: config
      storage_agent_path: config
      storage_agent_retention_min_time: config
      storage_agent_retention_max_time: config
      enable_feature: config
      agent: config
      auto_gomemlimit: config
      auto_gomemlimit_ratio: config
      alertmanager_notification_queue_capacity: config
      rules_alert_for_outage_tolerance: config
      rules_alert_for_grace_period: config
      rules_alert_resend_delay: config
      rules_max_concurrent_evals: config
      query_lookback_delta: config
      query_timeout: config
      query_max_concurrency: config
      query_max_samples: config
      log_level: config
  - resource: prometheus-rule-groups
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      file: config
      interval: config
      limit: config
      queryOffset: config
      evaluationTime: ignore
      lastEvaluation: ignore
  # Deleting an alerting rule silences that alert for good.
  - resource: prometheus-alerting-rules
    key_field: id
    name_field: name
    floors: {removed: high}
    fields:
      id: config
      name: config
      group: config
      file: config
      query: config
      duration: config
      keepFiringFor: config
      labels: config
      labels.name: config
      labels.value: config
      annotations: config
      annotations.name: config
      annotations.value: config
      type: ignore
      state: ignore
      health: ignore
      lastError: ignore
      alerts: ignore
      evaluationTime: ignore
      lastEvaluation: ignore
    lists:
      labels: {mode: set, key_field: name}
      annotations: {mode: set, key_field: name}
  - resource: prometheus-recording-rules
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      group: config
      file: config
      query: config
      labels: config
      labels.name: config
      labels.value: config
      type: ignore
      health: ignore
      lastError: ignore
      evaluationTime: ignore
      lastEvaluation: ignore
    lists:
      labels: {mode: set, key_field: name}
