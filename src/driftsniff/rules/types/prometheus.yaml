      alertmanagers.static_configs.targets: set
      alertmanagers.static_configs.labels: {mode: set, key_field: name}
      alertmanagers.file_sd_configs: set
      alertmanagers.file_sd_configs.files: set
      alertmanagers.relabel_configs: ordered-scalar
