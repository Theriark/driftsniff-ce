      boot.firmware: config
      boot.order: config
      PV_args: config
      CPUs.max: config
      CPUs.number: config
      memory.static: config
      memory.dynamic: config
      memory.size: ignore
      memory.usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      snapshots: ignore
      VDIs: ignore
      parent: ignore
    lists:
      tags: set
  - resource: hosts
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      hostname: config
      enabled: config
      version: config
      build: config
      productBrand: config
      multipathing: config
      powerOnMode: config
      supplementalPacks: config
      certificates.notAfter: config
      license_expiry: config
      logging: config
      otherConfig: config
      memory.size: ignore
      memory.usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      power_state: ignore
      startTime: ignore
      agentStartTime: ignore
      current_operations: ignore
      rebootRequired: ignore
      residentVms: ignore
    lists:
      supplementalPacks: set
      certificates: set
  - resource: pools
    key_field: id
    name_field: name_label
