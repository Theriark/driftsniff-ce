# Type tables of the Xen Orchestra collector (P5-T3 skeleton, completed by P8-T1). Notes with
# sources and dates: docs/vendor-notes/xo.md.
#
# Every field name below is UNVERIFIED. They are the names the plan lists for each collection
# (dev-work-plan part B, P8-T1). The vendor reference was not read for P8-T1 and no lab Xen
# Orchestra was used (Gate A is waived for development, test X2 is open), so no name is lab
# verified. A field that is not listed here is unclassified and shows as a fingerprint only. The
# notes list every name that needs a check.
#
# hidden_by_xo lists the values that Xen Orchestra itself does not return in clear. A change to
# such a value cannot be observed, so the interface says "hidden by XO" instead of showing a field
# that never moves. The marker does not change the class of a field, and the collector never relies
# on it to drop anything: a credential that does arrive is still unclassified or secret. A path
# below the name url.credentials is virtual: it stands for the user and password part of a remote
# address, which the collector strips before storage (P8-T2).
#
# The order of the boot devices is written as an ordered scalar list. The plan says ordered-keyed,
# but that mode needs a key field for the members and the shape of the field is unverified; the
# ordered scalar mode keeps the order and is also the safe default for a list.
#
# The backup job setting map of Xen Orchestra is keyed by schedule id, and a type table can only
# name fixed field paths. The XO collector therefore reads each key of the settings map of a
# backup job as one object of the derived resource backup-job-settings (the object id is the job
# id, a colon and the schedule id, or the word default for the key that has no schedule) and the
# settings field of the backup job itself is ignored.
#
# Security sensitive objects (XO servers, backup repositories, users, groups, ACL roles) have the
# object floor high. The only fields classed secret are the sign in methods of a user and the device
# configuration of a storage connection. A credential field that is not listed (a server password
# or token, a password hash) is unclassified, so it is shown as a fingerprint and never as a value.
version: 1
types:
  - resource: vms
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      notes: config
      tags: config
      auto_poweron: config
      high_availability: config
      secureBoot: config
      virtualizationMode: config
      boot.firmware: config
      boot.order: config
      blockedOperations: config
      affinityHost: config
      startDelay: config
      nicType: config
      vga: config
      videoram: config
      viridian: config
      resourceSet: config
      suspendSr: config
      PV_args: config
      cpuCap: config
      cpuMask: config
      cpuWeight: config
      coresPerSocket: config
      CPUs.max: config
      CPUs.number: config
      memory.static: config
      memory.dynamic: config
      memory.size: ignore
      memory.usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      $container: ignore
      power_state: ignore
      startTime: ignore
      agentStartTime: ignore
      installTime: ignore
      current_operations: ignore
      addresses: ignore
      mainIpAddress: ignore
      os_version: ignore
      xenTools: ignore
      vulnerabilities: ignore
      docker: ignore
      snapshots: ignore
      VDIs: ignore
      parent: ignore
    lists:
      tags: set
      boot.order: ordered-scalar
  # Only templates that are not built in belong here: the collector drops the built in ones after
  # the fetch (P8-T2). The field that tells them apart is not named by the plan and is unverified.
  - resource: vm-templates
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      notes: config
      tags: config
      auto_poweron: config
      high_availability: config
      secureBoot: config
      virtualizationMode: config
      boot.firmware: config
      boot.order: config
      blockedOperations: config
      affinityHost: config
      startDelay: config
      nicType: config
      vga: config
      videoram: config
      viridian: config
      resourceSet: config
      suspendSr: config
      PV_args: config
      cpuCap: config
      cpuMask: config
      cpuWeight: config
      coresPerSocket: config
      CPUs.max: config
      CPUs.number: config
      memory.static: config
      memory.dynamic: config
      memory.size: ignore
      memory.usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      $container: ignore
      current_operations: ignore
      snapshots: ignore
      VDIs: ignore
      parent: ignore
    lists:
      tags: set
      boot.order: ordered-scalar
  - resource: hosts
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      hostname: config
      enabled: config
      version: config
      build: config
      productBrand: config
      multipathing: config
      powerOnMode: config
      supplementalPacks: config
      certificates.notAfter: config
      license_expiry: config
      logging: config
      otherConfig: config
      memory.size: ignore
      memory.usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      power_state: ignore
      startTime: ignore
      agentStartTime: ignore
      current_operations: ignore
      rebootRequired: ignore
      residentVms: ignore
    lists:
      supplementalPacks: set
      certificates: set
  - resource: pools
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      HA_enabled: config
      haSrs: config
      default_SR: config
      crashDumpSr: config
      suspendSr: config
      migrationCompression: config
      platform_version: config
      otherConfig: config
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      current_operations: ignore
    lists:
      haSrs: set
  - resource: networks
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      MTU: config
      bridge: config
      automatic: config
      defaultIsLocked: config
      isBonded: config
      nbd: config
      insecureNbd: config
      other_config: config
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      current_operations: ignore
  - resource: pifs
    key_field: id
    fields:
      id: config
      device: config
      vlan: config
      mode: config
      ip: config
      netmask: config
      gateway: config
      dns: config
      currently_attached: ignore
      attached: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
  - resource: pbds
    key_field: id
    fields:
      id: config
      device_config: secret
      currently_attached: ignore
      attached: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
  - resource: srs
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      name_description: config
      SR_type: config
      content_type: config
      shared: config
      allocationStrategy: config
      inMaintenanceMode: config
      is_tools_sr: config
      size: ignore
      usage: ignore
      physical_usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      current_operations: ignore
      VDIs: ignore
  - resource: vifs
    key_field: id
    fields:
      id: config
      MAC: config
      MTU: config
      device: config
      lockingMode: config
      allowedIpv4Addresses: config
      allowedIpv6Addresses: config
      rateLimit: config
      txChecksumming: config
      attached: ignore
      currently_attached: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
    lists:
      allowedIpv4Addresses: set
      allowedIpv6Addresses: set
  - resource: vbds
    key_field: id
    fields:
      id: config
      bootable: config
      device: config
      is_cd_drive: config
      position: config
      read_only: config
      attached: ignore
      currently_attached: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      parent: ignore
  - resource: vdis
    key_field: id
    name_field: name_label
    fields:
      id: config
      name_label: config
      VDI_type: config
      size: config
      cbt_enabled: config
      image_format: config
      usage: ignore
      physical_usage: ignore
      uuid: ignore
      type: ignore
      _xapiRef: ignore
      $pool: ignore
      $poolId: ignore
      current_operations: ignore
      snapshots: ignore
      parent: ignore
  - resource: backup-jobs
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      type: config
      mode: config
      compression: config
      proxy: config
      remotes: config
      srs: config
      vms: config
      settings: ignore
      userId: ignore
    lists:
      remotes: set
      srs: set
      # The selection of VMs is a list of ids or a filter object; a filter object has no list.
      vms: set
  - resource: backup-job-settings
    key_field: id
    fields:
      id: config
      jobId: config
      scheduleId: config
      exportRetention: config
      snapshotRetention: config
      copyRetention: config
      reportRecipients: config
      reportWhen: config
      timeout: config
      concurrency: config
      offlineBackup: config
      offlineSnapshot: config
      fullInterval: config
      checkpointSnapshot: config
    lists:
      reportRecipients: set
  - resource: schedules
    key_field: id
    name_field: name
    fields:
      id: config
      jobId: config
      cron: config
      enabled: config
      name: config
      timezone: config
  - resource: backup-repositories
    key_field: id
    name_field: name
    floor: high
    hidden_by_xo: [url.credentials]
    fields:
      id: config
      name: config
      enabled: config
      url: config
      options: config
  - resource: proxies
    key_field: id
    name_field: name
    fields:
      id: config
      name: config
      address: config
      version: config
  - resource: servers
    key_field: id
    name_field: label
    floor: high
    hidden_by_xo: [password, token]
    fields:
      id: config
      label: config
      host: config
      username: config
      httpProxy: config
      allowUnauthorized: config
      readOnly: config
      enabled: config
      status: ignore
      error: ignore
  - resource: users
    key_field: id
    name_field: email
    floor: high
    fields:
      id: config
      username: config
      email: config
      permission: config
      groups: config
      authProviders: secret
      last_uses: ignore
    lists:
      groups: set
  - resource: groups
    key_field: id
    name_field: name
    floor: high
    fields:
      id: config
      name: config
      provider: config
      users: config
      aclRoleIds: config
    lists:
      users: set
      aclRoleIds: set
  - resource: acl-roles
    key_field: id
    name_field: name
    floor: high
    fields:
      id: config
      name: config
  # Collected only when the credential can reach it (coverage 403 or 404 otherwise). No field name
  # of a privilege is known, so only the key is classified (notes, section "Open items").
  - resource: acl-privileges
    key_field: id
    floor: high
    fields:
      id: config
