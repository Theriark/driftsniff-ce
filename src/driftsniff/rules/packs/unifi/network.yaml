# UniFi rules for sites, networks, DNS policies, traffic matching lists, WANs and device tags
# (P7-T4). The field names were checked on UniFi Network 10.6.109 (docs/vendor-notes/unifi.md),
# except those of device tags, which that controller did not have. A value a predicate compares
# that differs on a real controller simply does not match, and the change falls back to the next
# rule or to the unclassified rule.
#
# A DNS policy has a catch-all rule (path **): it also rates an added or removed policy medium,
# with a reason, instead of the unclassified rule.
version: 1
rules:
  - id: unifi.sites.name
    resource: unifi-sites
    path: name
    severity: low
    rationale: The site was renamed, which changes only how people find it.
  - id: unifi.sites.internal_reference
    resource: unifi-sites
    path: internalReference
    severity: low
    rationale: The internal reference of the site changed, which the controller uses for bookkeeping.
  - id: unifi.networks.name
    resource: unifi-networks
    path: name
    severity: low
    rationale: The network was renamed, which changes only how people find it.
  - id: unifi.networks.enabled
    resource: unifi-networks
    path: enabled
    severity: medium
    rationale: A network was switched on or off, which changes which devices can use it.
  - id: unifi.networks.default
    resource: unifi-networks
    path: default
    severity: medium
    rationale: A different network is now the default one, which changes where untagged devices land.
  - id: unifi.networks.management
    resource: unifi-networks
    path: management
    severity: high
    rationale: Who manages a network changed (for example the gateway), which changes who hands out its addresses and routes it.
  - id: unifi.networks.vlan_id
    resource: unifi-networks
    path: vlanId
    severity: high
    rationale: The VLAN number of a network changed, which can cut devices off from it or join them to another one.
  - id: unifi.networks.zone_id
    resource: unifi-networks
    path: zoneId
    severity: high
    rationale: A network moved to another firewall zone, so other firewall policies now apply to its devices.
  - id: unifi.dns_policies.any
    resource: unifi-dns-policies
    path: '**'
    severity: medium
    rationale: A DNS policy was added or removed, or a setting of it changed, which changes how a local name is answered.
  - id: unifi.dns_policies.domain
    resource: unifi-dns-policies
    path: domain
    severity: medium
    rationale: A DNS policy now answers for a different domain, which changes where that name leads.
  - id: unifi.dns_policies.ipv4_address
    resource: unifi-dns-policies
    path: ipv4Address
    severity: medium
    rationale: A DNS policy now answers with a different address, so the name leads somewhere else.
  - id: unifi.dns_policies.enabled
    resource: unifi-dns-policies
    path: enabled
    severity: medium
    rationale: A DNS policy was switched on or off, which changes how its domain is answered.
  - id: unifi.dns_policies.type
    resource: unifi-dns-policies
    path: type
    severity: medium
    rationale: The kind of a DNS policy changed, which changes the kind of answer it gives.
  - id: unifi.dns_policies.ttl
    resource: unifi-dns-policies
    path: ttlSeconds
    severity: low
    rationale: How long clients may keep the answer of a DNS policy changed, which changes only how fast a later change reaches them.
  - id: unifi.traffic_matching_lists.name
    resource: unifi-traffic-matching-lists
    path: name
    severity: low
    rationale: A traffic matching list was renamed, which changes only how people find it.
  - id: unifi.traffic_matching_lists.type
    resource: unifi-traffic-matching-lists
    path: type
    severity: medium
    rationale: The kind of a traffic matching list changed, which changes what its entries mean.
  - id: unifi.traffic_matching_lists.items
    resource: unifi-traffic-matching-lists
    path: items
    severity: high
    rationale: The entries of a traffic matching list changed, which changes what every firewall policy that uses the list matches.
  - id: unifi.wans.name
    resource: unifi-wans
    path: name
    severity: low
    rationale: An internet connection was renamed, which changes only how people find it.
  - id: unifi.device_tags.name
    resource: unifi-device-tags
    path: name
    severity: low
    rationale: A device tag was renamed, which changes only how people find it.
  - id: unifi.device_tags.device_ids
    resource: unifi-device-tags
    path: deviceIds
    severity: medium
    rationale: The devices that carry a tag changed, which can change which settings apply to them.
