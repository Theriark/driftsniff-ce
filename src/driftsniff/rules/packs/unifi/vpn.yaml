# UniFi rules for VPN tunnels, VPN servers and RADIUS profiles (P7-T4). All three have the object
# floor high, so an added or removed tunnel, server or profile is high without a rule here.
# UniFi Network 10.6.109 returns no key and no shared secret for them (docs/vendor-notes/unifi.md);
# the secret rules are kept for a version that does: they read only the fingerprints.
version: 1
rules:
  - id: unifi.vpn_tunnels.pre_shared_key
    resource: unifi-vpn-site-to-site-tunnels
    path: preSharedKey
    when: changed
    severity: critical
    rationale: The key of a site to site tunnel changed, so whoever holds the new key can join the tunnel.
  - id: unifi.vpn_tunnels.type
    resource: unifi-vpn-site-to-site-tunnels
    path: type
    severity: high
    rationale: The kind of a site to site tunnel changed, which changes how the two sites protect their traffic.
  - id: unifi.vpn_servers.pre_shared_key
    resource: unifi-vpn-servers
    path: preSharedKey
    when: changed
    severity: critical
    rationale: The key of a VPN server changed, so whoever holds the new key can connect to it.
  - id: unifi.vpn_servers.type
    resource: unifi-vpn-servers
    path: type
    severity: high
    rationale: The kind of a VPN server changed, which changes how remote users connect and are protected.
  - id: unifi.vpn_servers.enabled
    resource: unifi-vpn-servers
    path: enabled
    severity: high
    rationale: A VPN server was switched on or off, which opens or closes a way into the network from outside.
  - id: unifi.radius_profiles.shared_secret
    resource: unifi-radius-profiles
    path: sharedSecret
    when: changed
    severity: critical
    rationale: The shared secret of a RADIUS profile changed, so the authentication server that holds it decides who may join.
