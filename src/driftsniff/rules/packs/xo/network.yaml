# Xen Orchestra rules for networks and virtual network interfaces (P5-T3).
version: 1
rules:
  - id: xo.networks.name_label
    resource: networks
    path: name_label
    severity: low
    rationale: The network was renamed, which changes only how people find it.
  - id: xo.networks.mtu
    resource: networks
    path: MTU
    severity: medium
    rationale: The packet size limit of the network changed, which can break traffic that does not fit.
  - id: xo.networks.insecure_nbd
    resource: networks
    path: insecureNbd
    when: {name: boolean_flips_to, value: true}
    severity: high
    rationale: Unencrypted disk export over the network was switched on, so disk data can cross it in clear.
  - id: xo.vifs.rate_limit
    resource: vifs
    path: rateLimit
    severity: medium
    rationale: The bandwidth limit of a network interface changed, which changes how much traffic it can carry.
  - id: xo.vifs.locking_mode
    resource: vifs
    path: lockingMode
    severity: medium
    rationale: The address locking mode of a network interface changed, which controls which addresses it may use.
  - id: xo.vifs.allowed_ipv4_addresses
    resource: vifs
    path: allowedIpv4Addresses
    severity: medium
    rationale: The IPv4 addresses allowed on a network interface changed.
