name: Promote - Stage

run-name: ${{ inputs.dry_run && 'Promote - Stage (dry run)' || 'Promote - Stage' }}

# One button, run from development (the Stage approval dispatches it with no inputs). It takes the
# exact commit Development runs (its /healthz commit and the digest the Development app runs),
# requires the successful CI push run of that commit, runs the test suite at that commit, then
# tags the next release candidate v27.<minor>.<patch>-rc.<n> (scripts/release_version.py
# computes it from the existing tags), deploys that same digest to the Stage application,
# verifies health and commit and tags the image stage. It never rebuilds and never moves a branch:
# the gate script fast-forwards the stage branch to the candidate tag after a successful run (the
# Actions token may not move a branch to a commit that changes workflow files).
# A commit that already carries a candidate of the current line keeps it, so a re-run after a
# partial failure finishes the same promotion.
# dry_run=true runs every check and changes nothing: no tag, no image tag, no deploy.
# The first job (guard) fails a real run unless the repository variable PROMOTE_STAGE_ENABLED is
# exactly 'true'; a dry run only reports the switch.
# The summary records the image Stage ran before, the rollback target.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check everything and change nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: driftsniff-ce-pipeline
  cancel-in-progress: false

jobs:
  guard:
    name: Promotion switch is on
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    env:
      PROMOTE_STAGE_ENABLED: ${{ vars.PROMOTE_STAGE_ENABLED }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout guard script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Stop unless PROMOTE_STAGE_ENABLED is true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            state=on
            python3 scripts/guard_enabled.py PROMOTE_STAGE_ENABLED || state="off (a real run would stop here)"
            echo "- Check: switch PROMOTE_STAGE_ENABLED is ${state}" >> "${GITHUB_STEP_SUMMARY}"
          else
            python3 scripts/guard_enabled.py PROMOTE_STAGE_ENABLED
          fi

  resolve:
    name: Resolve the commit Development runs and the next candidate
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      ci_run: ${{ steps.ci.outputs.run }}
      digest: ${{ steps.image.outputs.digest }}
      candidate: ${{ steps.candidate.outputs.tag }}
      new_tag: ${{ steps.candidate.outputs.new }}

    env:
      IMAGE: ghcr.io/theriark/driftsniff-ce
      DEVELOPMENT_HOST: ${{ vars.DEVELOPMENT_HOST }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout pipeline code with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the commit Development runs
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || fail "Stage promotion runs from development; received ${GITHUB_REF}"
          [[ -n "${DEVELOPMENT_HOST}" ]] || fail "the repository variable DEVELOPMENT_HOST is missing"
          health="$(curl -fsS --max-time 20 "https://${DEVELOPMENT_HOST}/healthz")" || fail "https://${DEVELOPMENT_HOST}/healthz did not answer"
          commit="$(jq -r 'select(.status == "ok") | .commit // empty' <<< "${health}")"
          [[ "${commit}" =~ ^[0-9a-f]{40}$ ]] || fail "Development /healthz is not ok with a full commit: ${health}"
          git cat-file -e "${commit}^{commit}" || fail "${commit} does not exist in this repository"
          git merge-base --is-ancestor "${commit}" refs/remotes/origin/development || fail "${commit} is not in development history"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "- Check: Development /healthz is ok and reports \`${commit}\` (in development history)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Find the successful CI push run of that commit
        id: ci
        shell: bash
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=development&event=push&status=success&head_sha=${COMMIT}&per_page=1" --jq '.workflow_runs[0].id // empty')"
          [[ "${run}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::no successful CI push run on development for ${COMMIT}"
            exit 1
          }
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "- Check: CI push run ${run} on development succeeded for the commit" >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GitHub Container Registry (read only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Resolve the image published for the commit
        id: image
        shell: bash
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${COMMIT::12}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::no published image ${IMAGE}:sha-${COMMIT::12}"
            exit 1
          }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "- Check: image \`${IMAGE}:sha-${COMMIT::12}\` is \`${digest}\` (no rebuild)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Compute the release candidate
        id: candidate
        shell: bash
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          read -r tag state < <(python3 scripts/release_version.py candidate "${COMMIT}") || true
          tag="${tag:-}"
          state="${state:-}"
          [[ "${tag}" =~ ^v27\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || fail "unexpected candidate ${tag}"
          if [[ "${state}" == "existing" ]]; then
            [[ "$(git cat-file -t "refs/tags/${tag}")" == "tag" ]] || fail "${tag} is not an annotated tag"
            recorded="$(git tag -l --format='%(contents)' "${tag}" | jq -r '.imageDigest // empty' 2> /dev/null || true)"
            [[ -z "${recorded}" || "${recorded}" == "${DIGEST}" ]] || fail "${tag} records ${recorded}, not ${DIGEST}"
            new=false
          else
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null && fail "${tag} already exists on the remote"
            new=true
          fi
          {
            echo "tag=${tag}"
            echo "new=${new}"
          } >> "${GITHUB_OUTPUT}"
          echo "- Computed candidate: \`${tag}\` (${state} tag)" >> "${GITHUB_STEP_SUMMARY}"

  tests:
    name: Test suite at the promoted commit
    needs: resolve
    runs-on: ubuntu-24.04
    # the suite takes 15 to 20 minutes on a hosted runner (see ci.yml)
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout the promoted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip check

      - name: Run the automated tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q --ignore=tests/e2e --ignore=tests/image_first_run
          echo "- Check: test suite passed at \`$(git rev-parse HEAD)\`" >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote image to Stage
    needs:
      - resolve
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stage

    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/theriark/driftsniff-ce
      DRY_RUN: ${{ inputs.dry_run }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
      DIGEST: ${{ needs.resolve.outputs.digest }}
      IMAGE_REF: ghcr.io/theriark/driftsniff-ce@${{ needs.resolve.outputs.digest }}
      RC_TAG: ${{ needs.resolve.outputs.candidate }}
      CI_RUN_ID: ${{ needs.resolve.outputs.ci_run }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DOKPLOY_DEVELOPMENT_APPLICATION_ID: ${{ vars.DOKPLOY_DEVELOPMENT_APPLICATION_ID }}
      DOKPLOY_STAGE_APPLICATION_ID: ${{ vars.DOKPLOY_STAGE_APPLICATION_ID }}
      STAGE_HOST: ${{ vars.STAGE_HOST }}

    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the run and the secrets
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || fail "Stage promotion runs from development; received ${GITHUB_REF}"
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ && "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "resolve gave no commit or digest"
          for required in DOKPLOY_URL DOKPLOY_API_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET DOKPLOY_DEVELOPMENT_APPLICATION_ID DOKPLOY_STAGE_APPLICATION_ID STAGE_HOST; do
            [[ -n "${!required}" ]] || fail "${required} is missing"
          done
          # Information only: the gate script moves the stage branch after this run, so its
          # position never stops a promotion.
          stage_sha="$(git ls-remote origin refs/heads/stage | cut -f1)" || stage_sha=""
          {
            echo "- Check: the four Dokploy secrets are present"
            echo "- stage branch before: \`${stage_sha:-not read}\` (the gate script moves it after this run)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Confirm Development runs this image and read what Stage runs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/dokploy_release.py assert-image \
            --application-id "${DOKPLOY_DEVELOPMENT_APPLICATION_ID}" \
            --image "${IMAGE_REF}"
          python3 .github/scripts/dokploy_release.py show-image \
            --application-id "${DOKPLOY_STAGE_APPLICATION_ID}" | tee "${RUNNER_TEMP}/stage-image.txt"
          {
            echo "- Check: the Development app runs \`${IMAGE_REF}\`"
            echo "- Stage app before: $(cat "${RUNNER_TEMP}/stage-image.txt")"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create and push the annotated release candidate tag
        if: ${{ !inputs.dry_run && needs.resolve.outputs.new_tag == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          message="${RUNNER_TEMP}/rc-tag.json"
          python3 - > "${message}" <<'PY'
          import json
          import os

          print(json.dumps({
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "imageDigest": os.environ["DIGEST"],
              "developmentRunId": int(os.environ["CI_RUN_ID"]),
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
          }, sort_keys=True, separators=(",", ":")))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RC_TAG}" "${SOURCE_COMMIT}" -F "${message}"
          [[ "$(git rev-parse "refs/tags/${RC_TAG}^{commit}")" == "${SOURCE_COMMIT}" ]]
          git push origin "refs/tags/${RC_TAG}"
          echo "- Created annotated tag \`${RC_TAG}\` at \`${SOURCE_COMMIT}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Deploy exact digest to Stage and verify runtime
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/dokploy_release.py deploy \
            --application-id "${DOKPLOY_STAGE_APPLICATION_ID}" \
            --image "${IMAGE_REF}" \
            --health-url "https://${STAGE_HOST}/healthz" \
            --expected-commit "${SOURCE_COMMIT}" \
            --title "Stage ${SOURCE_COMMIT}" \
            --description "${GITHUB_REPOSITORY#*/} GitHub Actions run ${GITHUB_RUN_ID}" \
            --noop-ok

      - name: Tag the promoted image as stage
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # --prefer-index=false: a carbon copy, so the alias has the approved digest (by default a
          # single-platform image is wrapped in a new index with another digest)
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:stage" "${IMAGE_REF}"
          alias_digest="$(docker buildx imagetools inspect "${IMAGE}:stage" --format '{{.Manifest.Digest}}')"
          [[ "${alias_digest}" == "${DIGEST}" ]] || {
            echo "::error::${IMAGE}:stage resolves to ${alias_digest}, not ${DIGEST}"
            exit 1
          }

      - name: Record the result
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            result="dry run: no tag, image tag or deployment was made"
          else
            result="promoted"
          fi
          {
            echo
            echo "## driftsniff-ce Stage promotion"
            echo
            echo "- Result: ${result} (job status: ${{ job.status }})"
            echo "- Candidate: \`${RC_TAG}\`"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Immutable image: \`${IMAGE_REF}\`"
            echo "- CI push run: \`${CI_RUN_ID}\`"
            echo "- Stage URL: https://${STAGE_HOST}/"
            echo "- Rebuild performed: no; branch moved: none (the gate script moves stage)"
          } >> "${GITHUB_STEP_SUMMARY}"
