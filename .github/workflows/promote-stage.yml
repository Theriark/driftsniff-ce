name: Promote - Stage

run-name: publishing:${{ inputs.request_id }}

# Promotes the reviewed release candidate (RC) of a tested commit to Stage; never rebuilds and
# never creates or moves an RC. The private publisher dispatches this workflow after the separate
# native Promote to Stage approval, passing the exact RC it approved. The run verifies that the
# annotated RC tag points at source_commit and that its JSON message (sourceCommit, imageDigest,
# developmentRunId, documentationManifestSha256) matches the inputs, then deploys that same digest
# to the existing Stage application. The newest Development image is never substituted.
# Execution ref: development (the registered ref), or stage once the publisher has advanced it to
# source_commit without force. A run from stage must be at exactly source_commit.
# NOT enabled by default: the first job (guard) fails the run before any deploy step unless the
# repository variable PROMOTE_STAGE_ENABLED is exactly 'true'. It stays unset until Stage
# promotion is separately authorised, and it must be 'true' for an approved dispatch to proceed.
# Rollback is this workflow run again with the RC of an earlier approved candidate.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Publisher request identifier (also the run name)
        required: true
        type: string
      version:
        description: Version of the candidate, for example 27.1.0 or v27.1.0-rc.1
        required: true
        type: string
      source_commit:
        description: Full commit SHA the RC tag points at
        required: true
        type: string
      image:
        description: Immutable image of the RC, ghcr.io/theriark/driftsniff-ce@sha256:<digest> or sha256:<digest>
        required: true
        type: string
      development_run_id:
        description: Run ID of the successful Development run recorded in the RC
        required: true
        type: string
      documentation_manifest_sha256:
        description: SHA-256 of the reviewed documentation manifest recorded in the RC
        required: true
        type: string
      rc_tag:
        description: Existing annotated RC tag, v27.<minor>.<patch>-rc.<number>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: driftsniff-ce-pipeline
  cancel-in-progress: false

jobs:
  guard:
    name: Promotion switch is on
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    env:
      PROMOTE_STAGE_ENABLED: ${{ vars.PROMOTE_STAGE_ENABLED }}

    steps:
      - name: Checkout guard script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Stop unless PROMOTE_STAGE_ENABLED is true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/guard_enabled.py PROMOTE_STAGE_ENABLED

  promote:
    name: Promote image to Stage
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stage

    permissions:
      actions: read
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/theriark/driftsniff-ce
      REQUEST_ID: ${{ inputs.request_id }}
      VERSION_INPUT: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      IMAGE_INPUT: ${{ inputs.image }}
      DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
      DOCUMENTATION_MANIFEST_SHA256: ${{ inputs.documentation_manifest_sha256 }}
      RC_TAG: ${{ inputs.rc_tag }}
      GH_TOKEN: ${{ github.token }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DOKPLOY_STAGE_APPLICATION_ID: lhB_AOqk4FTEaHhEQcPKj
      STAGE_HOST: ce-stg-driftsniff.theriark.dev

    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate inputs, execution ref and source commit
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${REQUEST_ID}" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || fail "request_id has unexpected characters"
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || fail "source_commit must be a full 40-character commit SHA"
          [[ "${DEVELOPMENT_RUN_ID}" =~ ^[1-9][0-9]{0,17}$ ]] || fail "development_run_id must be a run ID integer"
          [[ "${DOCUMENTATION_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]] || fail "documentation_manifest_sha256 must be 64 lowercase hex characters"
          [[ "${RC_TAG}" =~ ^v27\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || fail "rc_tag must look like v27.<minor>.<patch>-rc.<number>"
          [[ "${VERSION_INPUT}" =~ ^v?27\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || fail "version must be 27.<minor>.<patch> or an RC of it"
          version_base="${VERSION_INPUT#v}"
          version_base="${version_base%%-rc.*}"
          rc_base="${RC_TAG#v}"
          rc_base="${rc_base%%-rc.*}"
          [[ "${version_base}" == "${rc_base}" ]] || fail "version ${VERSION_INPUT} does not belong to ${RC_TAG}"
          digest="${IMAGE_INPUT#"${IMAGE}@"}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "image must be ${IMAGE}@sha256:<64 lowercase hex characters>"
          case "${GITHUB_REF}" in
            refs/heads/development) ;;
            refs/heads/stage)
              [[ "${GITHUB_SHA}" == "${SOURCE_COMMIT}" ]] || fail "a run from stage must be at ${SOURCE_COMMIT}; found ${GITHUB_SHA}"
              ;;
            *) fail "Stage promotion must run from development or stage; received ${GITHUB_REF}" ;;
          esac
          for required in DOKPLOY_URL DOKPLOY_API_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            [[ -n "${!required}" ]] || fail "${required} is missing"
          done
          git fetch origin +refs/heads/development:refs/remotes/origin/development
          git cat-file -e "${SOURCE_COMMIT}^{commit}" || fail "${SOURCE_COMMIT} does not exist in this repository"
          git merge-base --is-ancestor "${SOURCE_COMMIT}" refs/remotes/origin/development || fail "${SOURCE_COMMIT} is not in development history"
          {
            echo "DIGEST=${digest}"
            echo "IMAGE_REF=${IMAGE}@${digest}"
          } >> "${GITHUB_ENV}"

      - name: Verify and consume the existing reviewed RC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys


          def fail(message):
              print("::error::" + message)
              sys.exit(1)


          def run(*args):
              return subprocess.run(args, check=True, capture_output=True, text=True).stdout.strip()


          tag = os.environ["RC_TAG"]
          source = os.environ["SOURCE_COMMIT"]
          digest = os.environ["DIGEST"]
          development_run = int(os.environ["DEVELOPMENT_RUN_ID"])
          manifest = os.environ["DOCUMENTATION_MANIFEST_SHA256"]
          repository = os.environ["GITHUB_REPOSITORY"]
          ref = "refs/tags/" + tag

          try:
              kind = run("git", "cat-file", "-t", ref)
          except subprocess.CalledProcessError:
              fail("RC tag " + tag + " does not exist; this workflow never creates an RC")
          if kind != "tag":
              fail("RC tag " + tag + " is not an annotated tag")
          if run("git", "rev-parse", ref + "^{commit}") != source:
              fail("RC tag " + tag + " does not point at " + source)
          try:
              meta = json.loads(run("git", "tag", "-l", "--format=%(contents)", tag))
          except ValueError:
              fail("the message of " + tag + " is not JSON")
          if not isinstance(meta, dict):
              fail("the message of " + tag + " is not a JSON object")
          expected = {
              "sourceCommit": source,
              "imageDigest": digest,
              "developmentRunId": development_run,
              "documentationManifestSha256": manifest,
          }
          for key, value in expected.items():
              found = meta.get(key)
              if found != value or type(found) is not type(value):
                  fail("RC tag " + tag + " field " + key + " does not match the dispatch inputs")

          try:
              release = json.loads(run("gh", "release", "view", tag, "--json", "isDraft,isPrerelease"))
          except (subprocess.CalledProcessError, ValueError):
              fail("no GitHub prerelease found for " + tag)
          if release.get("isDraft") or not release.get("isPrerelease"):
              fail("the GitHub release of " + tag + " must be a published prerelease")

          try:
              dev = json.loads(run("gh", "api", "repos/" + repository + "/actions/runs/" + str(development_run)))
          except (subprocess.CalledProcessError, ValueError):
              fail("Development run " + str(development_run) + " was not found in this repository")
          if dev.get("status") != "completed" or dev.get("conclusion") != "success":
              fail("Development run " + str(development_run) + " did not complete successfully")
          if dev.get("head_sha") != source:
              fail("Development run " + str(development_run) + " did not run " + source)
          print("RC " + tag + " verified for " + source + " at " + digest)
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Confirm the RC digest is the image published for the commit
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${SOURCE_COMMIT::12}"
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          [[ "${resolved}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::no published image ${IMAGE}:${tag} for ${SOURCE_COMMIT}"
            exit 1
          }
          [[ "${resolved}" == "${DIGEST}" ]] || {
            echo "::error::RC digest ${DIGEST} does not match the image published for ${SOURCE_COMMIT} (${resolved})"
            exit 1
          }
          docker buildx imagetools inspect "${IMAGE_REF}" > /dev/null
          echo "Resolved ${IMAGE_REF}"

      - name: Deploy exact digest to Stage and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/dokploy_release.py deploy \
            --application-id "${DOKPLOY_STAGE_APPLICATION_ID}" \
            --image "${IMAGE_REF}" \
            --health-url "https://${STAGE_HOST}/healthz" \
            --expected-commit "${SOURCE_COMMIT}" \
            --title "Stage ${SOURCE_COMMIT}" \
            --description "${GITHUB_REPOSITORY#*/} GitHub Actions run ${GITHUB_RUN_ID}" \
            --noop-ok

      - name: Tag the promoted image as stage
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:stage" "${IMAGE_REF}"
          alias_digest="$(docker buildx imagetools inspect "${IMAGE}:stage" --format '{{.Manifest.Digest}}')"
          [[ "${alias_digest}" == "${DIGEST}" ]] || {
            echo "::error::${IMAGE}:stage resolves to ${alias_digest}, not ${DIGEST}"
            exit 1
          }

      - name: Advance the stage branch to the promoted commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/stage:refs/remotes/origin/stage
          stage_sha="$(git rev-parse refs/remotes/origin/stage)"
          if [[ "${stage_sha}" == "${SOURCE_COMMIT}" ]]; then
            echo "stage already at ${SOURCE_COMMIT}"
          elif git merge-base --is-ancestor "${stage_sha}" "${SOURCE_COMMIT}"; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/stage" \
              -f sha="${SOURCE_COMMIT}" -F force=false > /dev/null
            stage_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" --jq '.object.sha')"
            [[ "${stage_sha}" == "${SOURCE_COMMIT}" ]] || {
              echo "::error::stage branch did not advance to ${SOURCE_COMMIT}"
              exit 1
            }
          elif git merge-base --is-ancestor "${SOURCE_COMMIT}" "${stage_sha}"; then
            echo "::warning::stage branch is ahead of ${SOURCE_COMMIT} (rollback); the branch is not moved and never forced"
          else
            echo "::error::stage branch ${stage_sha} diverges from ${SOURCE_COMMIT}; refusing to move it"
            exit 1
          fi

      - name: Record immutable Stage result
        shell: bash
        run: |
          {
            echo "## driftsniff-ce Stage promotion completed"
            echo
            echo "- Request: \`${REQUEST_ID}\`"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- RC tag: \`${RC_TAG}\`"
            echo "- Immutable image: \`${IMAGE_REF}\`"
            echo "- Development run: \`${DEVELOPMENT_RUN_ID}\`"
            echo "- Documentation manifest SHA-256: \`${DOCUMENTATION_MANIFEST_SHA256}\`"
            echo "- Stage URL: https://${STAGE_HOST}/"
            echo "- Rebuild performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
