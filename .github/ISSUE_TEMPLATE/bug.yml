name: Bug report
description: Something does not work as documented
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Do not paste credentials, API keys, tokens, real addresses or private configuration.**
        Security problems go through private reporting, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version and image
      description: >-
        The version and build shown under Settings › About (or the `version` and `commit` that
        /healthz answers), and the image tag or digest you run, for example
        ghcr.io/theriark/driftsniff-ce:27.0.0. For a source build, the commit of your checkout.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, with synthetic data only.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Which source is involved
      options:
        - UniFi Network
        - UniFi Protect
        - Xen Orchestra
        - Proxmox VE
        - Portainer
        - TrueNAS
        - Synology DSM
        - QNAP QTS / QuTS hero
        - Redfish (iDRAC, iLO, Supermicro)
        - Home Assistant
        - Grafana
        - Prometheus
        - Zabbix
        - Checkmk
        - Push source
        - Not specific to a source
    validations:
      required: true
  - type: input
    id: vendor-version
    attributes:
      label: Vendor version
      description: The version of the system the source reads, if a source is involved.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Redact anything sensitive first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I removed every secret, token and real address from this report.
          required: true
        - label: This is not a security vulnerability (those use private reporting).
          required: true
